name: 'Release - Stencil Storybook'

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Which release workflow should run?'
        required: true
        type: choice
        default: dev
        options:
          - dev
          - production
      bump:
        description: 'Semver bump to apply. "none" uses package.json as-is (the normal choice for dev builds). Production releases must pick patch/minor/major explicitly.'
        required: false
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  run-dev:
    if: ${{ inputs.channel == 'dev' }}
    uses: ./.github/workflows/release-dev.yml
    secrets: inherit
    with:
      bump: ${{ inputs.bump }}

  run-production:
    if: ${{ inputs.channel == 'production' }}
    uses: ./.github/workflows/release-production.yml
    secrets: inherit
    with:
      bump: ${{ inputs.bump }}
