name: 'Stencil Storybook Dev Release'

on:
  workflow_call:
    inputs:
      bump:
        description: 'Optional semver bump (patch, minor, major) to apply to the base version before computing the dev prerelease. Leave blank or "none" to use the current package.json version as-is.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  get_dev_version:
    name: 🏷️ Get Dev Build Version
    runs-on: ubuntu-latest
    outputs:
      dev-version: ${{ steps.generate-dev-version.outputs.DEV_VERSION }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: 🏷️ Generate Dev Version
        id: generate-dev-version
        working-directory: packages/plugin
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # Bump is applied only to this ephemeral checkout to compute the
          # dev version string - it is never committed back to the repo.
          if [ -n "$BUMP" ] && [ "$BUMP" != "none" ]; then
            npm version --no-git-tag-version --allow-same-version "$BUMP"
          fi
          PKG_JSON_VERSION=$(cat package.json | jq -r '.version')
          GIT_HASH=$(git rev-parse --short HEAD)
          DEV_VERSION=$PKG_JSON_VERSION-dev.$(date +"%s").$GIT_HASH
          echo "DEV_VERSION=$DEV_VERSION" >> $GITHUB_OUTPUT
        shell: bash

  publish_dev:
    name: 🚀 Publish Dev Build
    needs: get_dev_version
    uses: ./.github/workflows/publish-npm.yml
    with:
      tag: dev
      version: ${{ needs.get_dev_version.outputs.dev-version }}
